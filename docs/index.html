<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Visualizador IFC - GitHub Pages</title>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js';
    import { IfcViewerAPI } from 'https://cdn.jsdelivr.net/npm/web-ifc-viewer@1.0.177/dist/web-ifc-viewer.esm.js';

    window.onload = async () => {
      const container = document.getElementById('viewer');
      const viewer = new IfcViewerAPI({ container, backgroundColor: new THREE.Color(0xffffff) });

      viewer.axes.setAxes();
      viewer.grid.setGrid();

      // Carrega modelo IFC
      try {
        await viewer.IFC.loadIfcUrl('modelo.ifc');
      } catch (e) {
        container.innerHTML = "<p style='color:red'>Erro ao carregar modelo.ifc. Verifique se o arquivo está presente na pasta docs/.</p>";
        console.error(e);
      }
    };
  </script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
    #viewer { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="viewer"></div>
</body>
</html>
